<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/auth/auth.css" />
    <title>QiLin</title>
    <script>
      // Pre-paint theme resolution shared with the landing page: dark 玄金 is
      // the default; a stored 'light' choice flips the document root before
      // first paint.
      (() => {
        try {
          if (localStorage.getItem('ql-theme') === 'light') {
            document.documentElement.dataset.qlTheme = 'light'
            document.documentElement.style.colorScheme = 'light'
          }
        } catch { /* storage unavailable: keep the dark default */ }
      })()
    </script>
  </head>
  <body>
    <!--
      Pre-session authentication document served at /login and /setup. It is a
      static page: every user-visible string lives in this file, and
      src/auth/auth.ts only binds behaviour to the markup below. The server
      injects <base href="/">, so every relative URL resolves from the site root.
    -->
    <main class="ql-auth">
      <div class="ql-auth__glow" aria-hidden="true"></div>

      <!-- Theme toggle: behaviour from the shared pre-session module, labels
           and glyphs owned by this document. -->
      <button
        class="ql-theme-toggle"
        type="button"
        data-theme-toggle
        aria-label="切换到浅色主题"
        data-label-to-light="切换到浅色主题"
        data-label-to-dark="切换到深色主题"
      >
        <svg class="toggle-glyph--sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="toggle-glyph--moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>

      <!--
        Copy table. Each entry is keyed by data-copy and read by the module;
        nothing in src/auth/auth.ts carries product text. The inline strings in
        the markup below are the no-script rendering of the login-mode entries.
      -->
      <template id="auth-copy">
        <span data-copy="title.login">登录控制台</span>
        <span data-copy="title.register">创建账户</span>
        <span data-copy="title.setup">初始化管理员</span>
        <span data-copy="subtitle.login">登录您的账户</span>
        <span data-copy="subtitle.register">创建新账户</span>
        <span data-copy="subtitle.setup">请设置管理员账户以开始使用。</span>
        <span data-copy="submit.login">登录</span>
        <span data-copy="submit.register">创建账户</span>
        <span data-copy="submit.setup">创建管理员账户</span>
        <span data-copy="busy.login">请稍候…</span>
        <span data-copy="busy.register">正在创建账户…</span>
        <span data-copy="busy.setup">正在创建账户…</span>
        <span data-copy="toggle.toRegister">没有账户？立即注册</span>
        <span data-copy="toggle.toLogin">已有账户？立即登录</span>
        <span data-copy="label.identifier">用户名或邮箱</span>
        <span data-copy="label.username">用户名</span>
        <span data-copy="label.email">邮箱（可选）</span>
        <span data-copy="placeholder.identifier">请输入用户名或邮箱</span>
        <span data-copy="placeholder.username">3–32 位字母、数字、点、下划线或短横线</span>
        <span data-copy="placeholder.email">用于账户识别，可留空</span>
        <span data-copy="error.mismatch">两次密码不一致</span>
        <span data-copy="error.passwordLength">密码长度不能少于 8 位</span>
        <span data-copy="error.network">网络错误，请重试。</span>
        <span data-copy="error.invalid-credentials">用户名或密码不正确</span>
        <span data-copy="error.unauthorized">登录状态已失效，请重新登录</span>
        <span data-copy="error.password-too-short">密码长度不能少于 8 位</span>
        <span data-copy="error.invalid-username">用户名为 3–32 位字母、数字、点、下划线或短横线，并以字母或数字开头</span>
        <span data-copy="error.username-taken">该用户名已被占用，请换一个</span>
        <span data-copy="error.invalid-email">请输入有效的邮箱地址</span>
        <span data-copy="error.invalid-body">请填写完整的用户名与密码</span>
        <span data-copy="error.invalid-authority">请通过启动时打印的链接访问本页面</span>
        <span data-copy="error.email-taken">该邮箱已注册，请直接登录</span>
        <span data-copy="error.already-initialized">管理员账户已存在，请直接登录</span>
        <span data-copy="error.registration-closed">本部署未开放注册</span>
      </template>

      <div class="ql-shell">
        <section class="ql-card">
          <div class="ql-card__rule" aria-hidden="true"></div>
          <div class="ql-card__body">
            <header class="ql-head">
              <div class="ql-brand">
                <svg
                  class="ql-seal"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect x="1" y="1" width="22" height="22" rx="3.5" fill="#c3402f" />
                  <text
                    x="7.1"
                    y="15.4"
                    text-anchor="middle"
                    font-size="9.6"
                    font-weight="700"
                    fill="#fff5eb"
                    font-family="'Noto Serif SC','Songti SC','STSong',serif"
                  >麒</text>
                  <text
                    x="16.9"
                    y="15.4"
                    text-anchor="middle"
                    font-size="9.6"
                    font-weight="700"
                    fill="#fff5eb"
                    font-family="'Noto Serif SC','Songti SC','STSong',serif"
                  >麟</text>
                </svg>
                <span class="ql-wordmark">QiLin</span>
                <span class="ql-brand__divider" aria-hidden="true"></span>
                <h1 class="ql-title" id="auth-title">登录控制台</h1>
              </div>
              <p class="ql-subtitle" id="auth-subtitle">登录您的账户</p>
            </header>

            <form class="ql-form" id="auth-form">
              <!--
                One identity field serves both documents: the login name on the
                credential form, the account name on the two creation forms. The
                address below belongs to the creation forms only and is optional.
              -->
              <div class="ql-field">
                <label class="ql-label" for="auth-identifier" id="auth-identifier-label">用户名或邮箱</label>
                <input
                  class="ql-input"
                  id="auth-identifier"
                  name="identifier"
                  type="text"
                  autocomplete="username"
                  placeholder="请输入用户名或邮箱"
                  required
                />
              </div>
              <div class="ql-field" id="auth-email-field" hidden>
                <label class="ql-label" for="auth-email">邮箱（可选）</label>
                <input
                  class="ql-input"
                  id="auth-email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="用于账户识别，可留空"
                  disabled
                />
              </div>
              <div class="ql-field">
                <label class="ql-label" for="auth-password">密码</label>
                <input
                  class="ql-input"
                  id="auth-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="请输入密码"
                  minlength="8"
                  required
                />
              </div>
              <div class="ql-field" id="auth-confirm-field" hidden>
                <label class="ql-label" for="auth-confirm">确认密码</label>
                <input
                  class="ql-input"
                  id="auth-confirm"
                  name="confirm"
                  type="password"
                  autocomplete="new-password"
                  placeholder="再次输入密码"
                  minlength="8"
                  required
                  disabled
                />
              </div>
              <p class="ql-error" id="auth-error" aria-live="polite" hidden></p>
              <button class="ql-submit" id="auth-submit" type="submit">登录</button>
            </form>

            <p class="ql-toggle" id="auth-toggle-row" hidden>
              <button class="ql-toggle__button" id="auth-toggle" type="button">没有账户？立即注册</button>
            </p>

            <p class="ql-back">
              <a class="ql-back__link" href="/">← 返回首页</a>
            </p>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="./src/auth/auth.ts"></script>
  </body>
</html>
