# The dual-workbench Web design (plans/2026-10-05-dual-workbench-web-design.md,
# D4) disables `ui-agent-preset` in the shipped Web composition: the preset
# picker, the settings section, the session-header label, and the create-plugin
# menu item all live in this one plugin. This lane exists to drive those
# surfaces, so it re-enables the row the way a deployment that ships the
# picker would. An explicit `disabled: false` keeps the restatement correct
# whether a patch merges or replaces row-level fields.
- id: ui-agent-preset
  name: '@qilin-agent/client-ui-agent-preset'
  disabled: false
