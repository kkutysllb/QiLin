# Deterministic Agent Teams patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

# The runner is disabled, so its launcher identity never reaches agent-loop;
# the fixture below creates the stored root agent after the backend is ready.
- id: agent-loop
  config:
    agents: []

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent-report
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: fresh-agent
      name: './tests/fixtures/fresh-agent.ts'

    - id: agent-team
      name: '@qilin-agent/agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@qilin-agent/tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: team-fixture-llm
      name: './tests/fixtures/team-llm.mjs'
