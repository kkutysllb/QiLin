# Deterministic provider-retry patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

# The runner is disabled, so its launcher identity never reaches agent-loop;
# the fixture below creates the stored root agent after the backend is ready.
- id: agent-loop
  config:
    agents: []

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: fresh-agent
      name: './tests/fixtures/fresh-agent.ts'

    - id: retry-snapshot-backend
      name: './tests/fixtures/retry-snapshot-backend.mjs'
