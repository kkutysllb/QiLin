# Replay-backed goal patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

# The runner is disabled, so its launcher identity never reaches agent-loop;
# the fixture below creates the stored root agent after the backend is ready.
- id: agent-loop
  config:
    agents: []

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: fresh-agent
      name: './tests/fixtures/fresh-agent.ts'

    - id: llm-replay
      name: '@qilin-agent/llm-replay'
      config:
        # Register the replayed route so non-agent requests (the session-title
        # provider) can resolve a model adapter; the recorded scripts still
        # supply every stream.
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- id: session-log-deepseek
  config:
    enabled: false
