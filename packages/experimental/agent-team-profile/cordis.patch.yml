# Experimental Agent Teams profile layer. Apply after qilin-base so these replacements
# keep direct delegation and coordination on the Team tools.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-team
      name: '@qilin-agent/experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@qilin-agent/experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    # The browser half of the same feature: without it the roster and task board
    # the rows above enable have no right-Sidebar Team page to appear in.
    - id: client-ui-agent-team
      name: '@qilin-agent/experimental-client-ui-agent-team'
