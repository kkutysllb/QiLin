# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-deepseek
  name: '@qilin-agent/llm-deepseek'
  disabled: true

- id: system-prompt
  name: '@qilin-agent/system-prompt'
  config:
    personaPrefix: 'Echo where you run.'

- id: agent-instructions
  name: '@qilin-agent/agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@qilin-agent/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'
