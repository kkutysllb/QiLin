- name: '@qilin-agent/llm'
- name: '@qilin-agent/session'
- name: '@qilin-agent/session-projection'
- name: '@qilin-agent/system-prompt'
- name: '@qilin-agent/tools'
- name: '@qilin-agent/agent'
- name: '@qilin-agent/agent-loop'
  config:
    agents: []
- name: '@qilin-agent/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- id: llm-deepseek-api-key
  name: '@qilin-agent/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
