# The qilin-web-app bundle patch: the browser surface over the qilin-base layer.
# Applied after qilin-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `qilin --profile web --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: QILIN_TOOLS_MODE (native|ptc|both) opts a whole qilin
    # process into PTC mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.QILIN_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `qilin.client` rows are the browser roster the modules node half scans into
# window.__QILIN_BOOT__; the modules row is simultaneously a host row.
- insert:
    # Host-owned opt-in sampled when a new Web session receives its preset
    # delegation tools. The Plugins page edits this settings namespace.
    - id: subagent-model-selection-settings
      name: '@qilin-agent/tool-subagent/model-selection-settings'

    - id: message-feedback
      name: '@qilin-agent/message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@qilin-agent/session-log-export'

    # Session-header "Open In..." split button over the host application
    # resolution (macOS/Windows/Linux; a host with no resolved application
    # renders no button). Two halves: the host routes and the browser surface.
    # Session-workspace file media for inline previews: the document
    # preview's video viewer streams from this route (HTTP Range windows),
    # and the download disposition serves the raw file.
    - id: preview-media
      name: '@qilin-agent/host-preview-media'

    - id: open-in-app
      name: '@qilin-agent/host-open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    - id: ui-open-in-app
      name: '@qilin-agent/client-ui-open-in-app'

    - id: workspace
      name: '@qilin-agent/workspace'

    - id: session-reference
      name: '@qilin-agent/session-reference'

    - id: file-reference-local
      name: '@qilin-agent/file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@qilin-agent/session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@qilin-agent/session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@qilin-agent/host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@qilin-agent/host-plugin-inventory'

    # MCP server settings over the user patch layer: lists and rewrites the
    # mcp-client entries the settings page manages.
    - id: mcp-servers
      name: '@qilin-agent/mcp-servers'

    # Local browser accounts: the account file under the harness home, the
    # /api/auth endpoints, and the account-session gate over the application
    # entry and every /api request. Sign-in is required by default; a deployment
    # wanting the launch-token handoff alone sets enabled: false. Registration
    # stays open for the single-user loopback default — before binding beyond
    # loopback, set registration: closed, because anyone who can reach the
    # server could otherwise create an account with full harness access.
    - id: accounts
      name: '@qilin-agent/accounts-local'
      config:
        enabled: true
        registration: open
        sessionMaxAgeDays: 30

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@qilin-agent/api-session-controller'

    # The background-job roster, one job's observation record, and the human
    # kill, all over the generated `job` Remote namespace.
    - id: job-controller
      name: '@qilin-agent/api-job-controller'

    # Workspace file service: bounded read, directory listing, and the
    # agent-write change feed inside the session workspace root.
    - id: terminal-controller
      name: '@qilin-agent/api-terminal-controller'
    - id: workspace-files
      name: '@qilin-agent/api-workspace-files'

    # Workspace Git service: repository discovery, porcelain status, staging,
    # commits, branches, and push/pull inside the session workspace root.
    - id: workspace-git
      name: '@qilin-agent/api-workspace-git'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: settings-controller
      name: '@qilin-agent/api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@qilin-agent/api-workspace-controller'

    - id: cordis-host-runner
      name: '@qilin-agent/kylin-host-runner'

    # The Host inspect providers are process-global: the registry rejects a
    # duplicate id, so they register here once and every preset's `tool-kylin`
    # row reads them.
    - id: cordis-inspect-providers
      name: '@qilin-agent/tool-kylin/host'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@qilin-agent/web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat. This row rejects
    # wildcard binds and, when the invocation supplies a certificate and key,
    # listens over HTTPS.
    - id: webserver
      name: '@qilin-agent/host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        tls: !!js ctx.webStartup.tls
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024
        # The port opens once the whole Loader tree has settled: every route
        # and upgrade owner has registered by then, so the first external
        # connection (a reconnecting browser tab after a restart) never lands
        # on startup 404s.
        listenOn: settle

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of qilin-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full Loader tree settles and the required-
    # entry audit passes. The
    # webStartup provider supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the host-owned
    # shell variable.
    - id: web-runtime
      name: '@qilin-agent/web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@qilin-agent/client-hmr'

    # ── browser plugin roster (qilin.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__QILIN_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@qilin-agent/client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@qilin-agent/client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service.
    - id: file-upload
      name: '@qilin-agent/client-file-upload'

    - id: api-remotes
      name: '@qilin-agent/api-remotes'

    - id: cordis-client-runner
      name: '@qilin-agent/kylin-client-runner'

    - id: ui-theme
      name: '@qilin-agent/client-ui-theme'

    - id: locale
      name: '@qilin-agent/client-locale'

    - id: shortcuts
      name: '@qilin-agent/client-shortcuts'

    - id: ui-shortcuts
      name: '@qilin-agent/client-ui-shortcuts'

    - id: ui-layout
      name: '@qilin-agent/client-ui-layout'

    - id: ui-renderer
      name: '@qilin-agent/client-ui-renderer'

    - id: ui-session
      name: '@qilin-agent/client-ui-session'

    # Unified resource model: protocol providers behind the useResource hook.
    - id: resources
      name: '@qilin-agent/client-resources'

    - id: ui-sidebar
      name: '@qilin-agent/client-ui-sidebar'

    # The sidebar foot's account button: the theme and language switches, the
    # Settings entry, and sign-out, over the account gate's status read.
    - id: ui-account
      name: '@qilin-agent/client-ui-account'

    # The right Sidebar: one docking surface per session over ui-dockkit.
    - id: ui-sidebar-right
      name: '@qilin-agent/client-ui-sidebar-right'


    - id: office-to-pdf
      name: '@qilin-agent/office-to-pdf'

    # The right Sidebar's document tab: bounded file reads with selectable
    # Markdown, code, HTML, PDF, Office, and plain-text renderers.
    - id: ui-sidebar-documentpreview
      name: '@qilin-agent/client-ui-sidebar-documentpreview'

    # Sandboxed HTTP(S) Browser tabs, including loopback targets.
    - id: ui-sidebar-browser
      name: '@qilin-agent/client-ui-sidebar-browser'

    - id: ui-sidebar-terminal
      name: '@qilin-agent/client-ui-sidebar-terminal'
    # The right Sidebar's workspace file tree tab type.
    - id: ui-sidebar-files
      name: '@qilin-agent/client-ui-sidebar-files'

    - id: ui-settings
      name: '@qilin-agent/client-ui-settings'

    - id: ui-settings-general
      name: '@qilin-agent/client-ui-settings-general'

    - id: ui-settings-models
      name: '@qilin-agent/client-ui-settings-models'

    # The MCP servers page: patch-layer CRUD over the mcpServers Remote.
    - id: ui-settings-mcp
      name: '@qilin-agent/client-ui-settings-mcp'

    # The skills page: the current Session's catalog over the skills Remote.
    - id: ui-settings-skills
      name: '@qilin-agent/client-ui-settings-skills'

    # Read-only Plugin list tab in the Settings Plugins section; the built-in
    # bundles the sidebar page leaves out are inspected here.
    - id: ui-settings-plugin-inventory
      name: '@qilin-agent/client-ui-settings-plugin-inventory'

    # Plugin management: the sidebar Plugins page installs, enables, disables,
    # and removes the profile's bundles through the `pluginManager` Remote.
    # Without a profile-backed Host it reports itself unavailable.
    - id: ui-plugin-manager
      name: '@qilin-agent/client-ui-plugin-manager'

    - id: ui-settings-unarchive-sessions
      name: '@qilin-agent/client-ui-settings-unarchive-sessions'

    - id: ui-conversation
      name: '@qilin-agent/client-ui-conversation'

    - id: ui-approval
      name: '@qilin-agent/client-ui-approval'

    - id: ui-chat
      name: '@qilin-agent/client-ui-chat'

    - id: ui-attachment
      name: '@qilin-agent/client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@qilin-agent/client-ui-tool'

    - id: ui-cordis
      name: '@qilin-agent/client-ui-kylin'

    # Turn tail: the changed-files card and delivery cards under each closing
    # assistant message. Remove this entry to turn the surface off; the tail
    # hole renders empty.
    - id: ui-deliverables
      name: '@qilin-agent/client-ui-deliverables'

    # Opens what the model asked to see (`sidebar_open`) in the Session's own
    # Sidebar; remove this row to leave every request undelivered.
    - id: ui-agent-opens
      name: '@qilin-agent/client-ui-agent-opens'

    # Records each top-level turn's changed files from git working-tree
    # snapshots; the changed-files card above renders its events.
    - id: workspace-changes
      name: '@qilin-agent/workspace-changes'


    # The workbench tag owner: the general/coding selection, per-tag preset
    # memory, and the session-visibility fold consumed by the session list
    # (dual-workbench design, plans/2026-10-05-dual-workbench-web-design.md).
    - id: ui-workbench
      name: '@qilin-agent/client-ui-workbench'
    # The coding workbench content body: registers `rightbar.session.coding`
    # (rendered by ui-sidebar-right under the coding tag), the interception
    # faces, and the /sidebar host routes (plan §2.2/S3).
    - id: ui-workspace
      name: '@qilin-agent/client-ui-workspace'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@qilin-agent/client-ui-workflow-run'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@qilin-agent/client-ui-input-trigger'

    - id: ui-commands
      name: '@qilin-agent/client-ui-commands'

    - id: ui-skill
      name: '@qilin-agent/client-ui-skill'

    - id: ui-subagent
      name: '@qilin-agent/client-ui-subagent'

    - id: ui-reference
      name: '@qilin-agent/client-ui-reference'

    # Background jobs: the session-header list over the job Remote streams.
    - id: ui-jobs
      name: '@qilin-agent/client-ui-jobs'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@qilin-agent/client-ui-goal'

    # The feedback surface: Like/Dislike in the assistant-message action
    # strip, the feedback dialog behind Dislike and /feedback with its
    # acknowledgement toast, over the messageFeedback and sessionFeedback Remotes.
    - id: ui-message-feedback
      name: '@qilin-agent/client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@qilin-agent/client-ui-model-selection'

    - id: ui-permission
      name: '@qilin-agent/client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Disabled since the dual-workbench Web design
    # (plans/2026-10-05-dual-workbench-web-design.md, D4): the picker, the
    # settings section, the header label, and the create-plugin menu item all
    # live in this one plugin, and the workbench tags replace them. The row
    # stays so the web-app dependency declaration keeps passing
    # verify-cordis-config; the plugin itself remains installable.
    - id: ui-agent-preset
      name: '@qilin-agent/client-ui-agent-preset'
      disabled: true
    - id: ui-settings-session-log
      name: '@qilin-agent/client-ui-settings-session-log'


    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards. A namespace this deployment does not expose renders nothing.
    - id: ui-settings-plugins
      name: '@qilin-agent/client-ui-settings-plugins'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@qilin-agent/client-ui-plan'

    - id: ui-user-questions
      name: '@qilin-agent/client-ui-user-questions'

    - id: ui-trajectory
      name: '@qilin-agent/client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# Web surface disables them here and lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

# `shell-env` STAYS in the host plane: `apps/cli/src/web.ts` injects it to
# publish `QILIN_WEB_URL`/`QILIN_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# would never reach the model's shell at all.

- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. Its producers — `tool-bash` here, `tool-terminal` and a
# non-continuable `tool-subagent` elsewhere — are preset rows that resolve it
# with `ctx.get`, and an entry-local realm around the registry is invisible to
# every sibling row outside that realm, so `run_in_background` answered
# "background jobs unavailable" while the controls sat in the catalog. That is
# the `goals` criterion read from inside the preset: a Service a row outside its
# realm READS belongs to the plane both can see. The registry is keyed by owning
# agent, so one host instance serves every session exactly as before presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# The `skill` REGISTRY stays in the host plane. It is host+per-scope layered
# (the tools-registry shape): deployment-level providers — repository plugins,
# a host skill-filesystem row — register into its global layer, while a preset's
# `skill-filesystem` registers into that preset's layer, and each agent reads the
# merged catalog its scope chain selects. Only the per-agent rows move behind
# presets: the base host `skill-filesystem` row is disabled here (presets own local
# discovery), and `tool-skill` is what a preset mounts to give its agent the
# catalog and loader at all.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane, where Gateway
# remotes resolve them. Presets own the human command and model-facing tool.

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. It owns the context-meter projection units, and that table is
# process-wide, so preset ownership would make the meter a function of which
# presets happen to be mounted rather than a per-session fact. Same criterion as
# `tasks` and `goals`; the reasoning has one home in
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`.

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane. `subagents` is
# a process singleton with a cross-session query surface (`listChildren`,
# `followup`) that the host api-proxy serves to the browser, and a provider
# registers under a globally unique name, so a per-session copy would both
# starve that host row and collide on the second session. What a preset
# chooses is which delegation TOOLS its agent sees, below.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset roster. The shipped presets are bundled inside
# `qilin-agent-presets` itself and prepended as a read-only `system` root
# (`includeShippedRoot`); `$QILIN_HOME/.agent-presets` is where a person — or an
# agent — authors their own, appended by the same package (`includeUserRoot`),
# and carries the same trust as shell access because a preset IS a
# composition. This row only names the default and any deployment-added
# `roots`; no launcher patching is involved.
- insert:
    - id: agent-presets
      name: '@qilin-agent/agent-presets'
      config:
        default: standard
