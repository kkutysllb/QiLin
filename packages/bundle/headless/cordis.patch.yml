# The qilin-headless bundle patch: one-shot task mode directly over qilin-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`qilin --profile headless "<task>"`), the `--session-id` and `--json` options,
# and this app's --help, then the direct driver creates a fresh Agent, or adopts
# the exact Session the flag names, through the core registry and prints its
# durable result.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    # This surface's own process-wide PTC fallback and override. It is
    # independent of the Web preset default: headless mounts no agent presets,
    # so its one-shot agents keep the PTC presentation unless the environment
    # overrides it.
    mode: !!js process.env.QILIN_TOOLS_MODE ?? 'ptc'

- insert:
    - id: headless-startup
      name: '@qilin-agent/headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@qilin-agent/headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json

- id: hmr
  disabled: true

# One-shot jobs use launch-time credentials (environment and .env) instead of
# the interactive store: headless never reads the managed credentials document.
- id: credentials
  disabled: true
