# The QiLin browser-surface bundle patch: QiLin product identity layered over
# the dsh-web-app composition. Applied after dsh-web-app and before the
# profile's own cordis.patch.yml, so a deployment or user layer can still
# replace every row below.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.

# The model-facing product identity. dsh-web-app states the same two keys for
# the dsh surface; QiLin names itself here instead.
- id: system-prompt
  config:
    personaPrefix: >-
      You are QiLin, a coding agent powered by the {{model}} model.
    personaSuffix: Your working directory is {{cwd}}.

# The QiLin product label on the startup URL line, the browser handoff line,
# and the launch-failure hint. dsh-web-app states the same row for the dsh
# surface, so QiLin restates every key it owns.
- id: web-runtime
  config:
    label: qilin
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

# ── the QiLin browser roster ────────────────────────────────────────────────

# The 麒麟 seal occupies the sidebar and conversation-hero brand marks; the
# sidebar brand name keeps the shell's own fallback, which carries the build
# version badge.

# `dsh.client` rows are scanned into the browser module roster. The brand color
# layer stacks over whichever palette the user selected in Settings.
- insert:
    - id: ui-brand-qilin
      name: '@deepseek-ai/dsh-client-ui-brand-qilin'

    - id: ui-theme-qilin
      name: '@deepseek-ai/dsh-client-ui-theme-qilin'
