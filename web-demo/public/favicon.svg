<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 静态复刻 src/components/kworks-logo.tsx 的 QiLinLogo（玄金麒麟 VI · 朱砂麒麟双字印），
       浏览器标签图标与商标 Logo 同底色同「麒麟」双字 -->
  <defs>
    <!-- 朱砂底：顶部微亮的垂直渐变（与 QiLinLogo 同色同档） -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4503d"/>
      <stop offset="55%" stop-color="#c3402f"/>
      <stop offset="100%" stop-color="#a23526"/>
    </linearGradient>
  </defs>

  <!-- 章底 -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>
  <!-- 顶部微光（暖白高光，克制的一层） -->
  <ellipse cx="256" cy="-40" rx="300" ry="150" fill="#fff5eb" opacity="0.08"/>
  <!-- 内圈鎏金细线 -->
  <rect x="20" y="20" width="472" height="472" rx="92" ry="92" fill="none" stroke="#f3dc9e" stroke-opacity="0.5" stroke-width="8"/>

  <!-- 「麒麟」双字主体（横排，字号随双字收窄，与 QiLinLogo 同参） -->
  <text x="151" y="333" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','STSong','SimSun',serif" font-size="205" font-weight="700" fill="#fff5eb">麒</text>
  <text x="361" y="333" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','STSong','SimSun',serif" font-size="205" font-weight="700" fill="#fff5eb">麟</text>
</svg>
