# Desktop Release — 桌面端发版（手动 dispatch，mac-arm64）。
#
# 版本 tag 只走引擎／源代码与网页版发布链；桌面安装包不随 tag 自动构建，由本
# 工作流手动 dispatch 指定一个已推送的 tag 才打包，产物汇入该 tag 的 GitHub
# Release（create-or-upload 收敛与源代码发布的竞态）。
#
# 签名公证：凭据 job 级注入，缺一即拒（fail-closed，KStock 教训 F5——
# electron-builder 缺凭据会静默出未签名包）。变量名必须是 MAC_CERTIFICATE*
# （build-desktop.sh/ensure-macos-keychain.sh 认的名字），不能叫 CSC_LINK/
# CSC_KEY_PASSWORD——那会触发 electron-builder 有缺陷的临时钥匙串分支。
#
# 与本地入口 desktop/scripts/release.sh 共用同一构建/门禁脚本（同源）。
name: Release (desktop)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建发布的 tag（如 v3.2.0，须已推送）"
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 打包（macOS arm64）
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PWD: ${{ secrets.MAC_CERTIFICATE_PWD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # 引擎运行时闭包：本仓 HEAD 的 git worktree → install → build:qilin
      # → 生产重装收闭包 → tar + 封盘清单（与本地同源脚本，引擎即本仓）
      - name: 桌面端测试
        working-directory: desktop
        run: npm test

      - name: 运行时闭包封盘
        run: bash desktop/scripts/build-runtime-bundle.sh

      # 签名公证 fail-closed 门：缺凭据即拒，门前拦，不指望 builder
      - name: 签名公证凭据检查
        run: |
          for v in MAC_CERTIFICATE MAC_CERTIFICATE_PWD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(eval "echo \$$v")" ]; then echo "缺 secrets 对应凭据: $v——发布必须签名公证" >&2; exit 1; fi
          done
          echo "签名公证凭据齐备"

      # electron-builder（dmg/zip arm64 + latest-mac.yml + blockmap；签名+公证）
      - name: 桌面打包（签名 + 公证）
        run: bash desktop/scripts/build-desktop.sh --skip-bundle

      # 产物门禁 V1–V7（安装包/更新元数据/交叉引用/闭包哈希/dmg 校验/版本一致/闭包冒烟）
      - name: 产物门禁
        run: bash desktop/scripts/verify-desktop-artifacts.sh

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          if-no-files-found: error
          path: |
            desktop/dist-exe/*.dmg
            desktop/dist-exe/*.zip
            desktop/dist-exe/*.blockmap
            desktop/dist-exe/latest-mac.yml

  publish:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          sparse-checkout: desktop/release

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: dist-exe

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES_FILE="desktop/release/${TAG}.md"
          NOTES_ARGS=()
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS+=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS+=(--generate-notes)
          fi
          gh release create "$TAG" dist-exe/* --title "QiLin $TAG" "${NOTES_ARGS[@]}" || \
            gh release upload "$TAG" dist-exe/* --clobber
