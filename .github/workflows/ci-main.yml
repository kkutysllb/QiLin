# Post-merge static and unit lane for this repository's `main` branch.
#
# Upstream's ci.yml is pull-request-only and its jobs target runner pools this
# repository does not have, so without this lane a main push runs no lint, type,
# duplication, or unit gate at all. Every step below is one of this repository's
# own package.json scripts on a GitHub-hosted runner; `test` is the same command
# ci.yml's primary aggregate runs. Post-merge platform carriers stay in
# ci-master.yml.
#
# The gates run individually rather than through `check:ci:static`, which also
# carries the documentation gates and needs a base-ref environment value.
name: CI main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  QILIN_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: lint, types, duplication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Duplication
        run: pnpm run duplication

  unit:
    name: unit tests
    # Split from the static job so a unit failure does not hide the static
    # verdict. The full suite reaches built `lib/` subpaths (Typert remote
    # clients, client `./types` leaves) and exercises confined subprocesses, so
    # this job builds and prepares bubblewrap the way ci.yml's carriers do; the
    # `test` script itself only builds the native host addon. The per-test budget
    # is the value ci.yml's full-suite carrier sets: a hosted runner needs more
    # than the 5 s default for the specs that scan the built tree.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Build
        run: pnpm run build

      # Same two commands as `pnpm run test`, with the per-test budget ci.yml's
      # coverage carrier sets through QILIN_COVERAGE_TEST_TIMEOUT_MS.
      - name: Unit tests
        run: |
          pnpm run build:native-system
          pnpm exec vitest run --testTimeout=90000 --expect.poll.timeout=90000 --hookTimeout=90000
