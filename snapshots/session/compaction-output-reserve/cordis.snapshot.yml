# With 1,800 tokens of headroom, a 1,000-token output reservation lowers the
# trigger from 8,240 to 7,500, between the history and its condensed replacement.

- id: llm-deepseek
  disabled: true

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@qilin-agent/compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@qilin-agent/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 10300
                defaultMaxTokens: 1000
