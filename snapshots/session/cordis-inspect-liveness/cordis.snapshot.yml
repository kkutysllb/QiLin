- id: llm-deepseek
  name: '@qilin/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@qilin/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@qilin/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@qilin/agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@qilin/tools'
  config:
    mode: both

- id: system-prompt
  name: '@qilin/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@qilin/kylin-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@qilin/tool-kylin/host'
    - id: tool-cordis
      name: '@qilin/tool-kylin'
    - id: llm-replay
      name: '@qilin/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: client-inspect-liveness-fixture
      name: ./client-fixture.mjs
