# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-deepseek
  name: '@qilin-agent/llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@qilin-agent/subprocess-local'

- id: agent-default-model
  name: '@qilin-agent/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: !!js 'process.env.QILIN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@qilin-agent/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@qilin-agent/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@qilin-agent/tool-jobs'
  disabled: true

- id: goal
  name: '@qilin-agent/goal'
  disabled: true

- id: goal-round-driver
  name: '@qilin-agent/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@qilin-agent/command-goal'
  disabled: true

- id: tool-goal
  name: '@qilin-agent/tool-goal'
  disabled: true

- id: skill
  name: '@qilin-agent/skill'
  disabled: true

- id: skill-filesystem
  name: '@qilin-agent/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@qilin-agent/tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@qilin-agent/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@qilin-agent/spill-local'
  config:
    root: !!js process.env.QILIN_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.QILIN_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.QILIN_SNAPSHOT_SPILL_LOCATOR_ROOT
