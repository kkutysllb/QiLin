# Workspace-context snapshot patch: keep project-root and user-global
# discovery inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@qilin-agent/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: !!js 'process.env.QILIN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@qilin-agent/agent-instructions'
  config:
    maxBytes: 65536
    qilinHome: !!js process.cwd() + '/.qilin'
    projectRootMarkers:
      - .qilin-project

- id: system-prompt
  name: '@qilin-agent/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
