# Keyless replay counterpart of system-prompt-in-history/cordis.yml: the
# replay route declares the same in-history capability.
- id: llm-deepseek
  disabled: true

- id: agent-default-model
  name: '@qilin-agent/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@qilin-agent/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
                systemPromptUpdate: in-history
                inputModalities: [text, image]
    - id: in-history-prompt-update
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/in-history-prompt-update.ts'
