- id: agent-default-model
  name: '@qilin-agent/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: !!js 'process.env.QILIN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@qilin-agent/agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@qilin-agent/tools'
  config:
    mode: native

- id: system-prompt
  name: '@qilin-agent/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@qilin-agent/kylin-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@qilin-agent/tool-kylin/host'
    - id: tool-cordis
      name: '@qilin-agent/tool-kylin'
    - id: client-inspect-timeout-fixture
      name: ./client-fixture.mjs
