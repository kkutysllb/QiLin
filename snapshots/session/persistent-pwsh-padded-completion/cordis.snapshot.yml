# Keyless replay for padded persistent PowerShell completion frames.
- id: llm-deepseek
  name: '@qilin-agent/llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@qilin-agent/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- insert:
    - id: terminal
      name: '@qilin-agent/terminal'

- id: sandbox-policy
  name: '@qilin-agent/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@qilin-agent/subprocess-local'

- insert:
    - id: padded-pwsh-backend
      name: './pwsh-snapshot-backend.mjs'

- id: agent-default-model
  name: '@qilin-agent/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@qilin-agent/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@qilin-agent/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@qilin-agent/tool-jobs'
  disabled: true

- id: goal
  name: '@qilin-agent/goal'
  disabled: true

- id: goal-round-driver
  name: '@qilin-agent/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@qilin-agent/command-goal'
  disabled: true

- id: tool-goal
  name: '@qilin-agent/tool-goal'
  disabled: true

- id: skill
  name: '@qilin-agent/skill'
  disabled: true

- id: skill-filesystem
  name: '@qilin-agent/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@qilin-agent/tool-skill'
  disabled: true

- id: tool-bash
  name: '@qilin-agent/tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@qilin-agent/tool-pwsh-persistent'
