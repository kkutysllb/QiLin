- insert:
    - id: office-skills
      name: '@qilin-agent/skill-office'
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        node: !!js process.cwd() + '/office-node'
        cli: !!js process.cwd() + '/office-cli.js'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  config:
    protocol: chat-completions
    thinking: enabled
    reasoningEffort: high
    maxTokens: 8192
    models:
      - id: deepseek-v4-flash
