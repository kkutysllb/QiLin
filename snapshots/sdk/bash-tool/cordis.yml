# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@qilin-agent/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@qilin-agent/llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@qilin-agent/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: !!js "process.env.QILIN_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@qilin-agent/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: session-log-deepseek
  config:
    enabled: false
