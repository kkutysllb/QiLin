# TypeScript SDK snapshot-record patch over `qilin --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@qilin/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@qilin/llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@qilin/session-persistence-jsonl'
  config:
    root: !!js qilinHomePath('sessions')
    compression: !!js "process.env.QILIN_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@qilin/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: session-log-deepseek
  name: '@qilin/session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: serial-created-fixture
      name: '../../../packages/core/agent-loop/tests/fixtures/serial-created.mjs'
